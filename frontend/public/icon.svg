<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="32" y="32" width="448" height="448" rx="104" fill="none" stroke="#1e293b" stroke-width="4" />
  <g filter="url(#glow)">
    <!-- Headphones Arc -->
    <path d="M128 260 C128 170, 185 112, 256 112 C327 112, 384 170, 384 260" fill="none" stroke="url(#grad)" stroke-width="32" stroke-linecap="round"/>
    <!-- Left Ear Cup -->
    <rect x="104" y="240" width="48" height="88" rx="24" fill="url(#grad)" />
    <!-- Right Ear Cup -->
    <rect x="360" y="240" width="48" height="88" rx="24" fill="url(#grad)" />
    <!-- Center Microphone -->
    <rect x="226" y="220" width="60" height="96" rx="30" fill="url(#grad)" />
    <!-- Mic Stand -->
    <path d="M206 280 C206 320, 230 338, 256 338 C282 338, 306 320, 306 280" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linecap="round"/>
    <path d="M256 338 L256 380 M216 380 L296 380" fill="none" stroke="url(#grad)" stroke-width="16" stroke-linecap="round"/>
  </g>
</svg>
